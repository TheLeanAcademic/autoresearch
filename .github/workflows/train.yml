name: autoresearch training

on:
  push:
    branches:
      - 'autoresearch/**'

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache TinyStories data
        uses: actions/cache@v4
        with:
          path: ~/.cache/autoresearch
          key: autoresearch-tinystories-v1

      - name: Install dependencies
        run: uv sync

      - name: Download data
        run: uv run prepare.py

      - name: Run training
        run: uv run train.py > run.log 2>&1

      - name: Show results
        if: always()
        run: grep "^val_bpb:\|^peak_vram_mb:\|^num_params_M:" run.log || tail -n 50 run.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.sha }}
          path: run.log

      - name: Compare val_bpb and auto-merge if improved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VAL_BPB=$(grep "^val_bpb:" run.log | tail -1 | awk '{print $2}')
          if [ -z "$NEW_VAL_BPB" ]; then
            echo "ERROR: val_bpb not found in run.log — skipping merge."
            exit 1
          fi
          echo "New val_bpb: $NEW_VAL_BPB"

          git fetch origin master
          BASELINE=$(git show origin/master:best_val_bpb.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$BASELINE" ]; then
            BASELINE="9999.0"
          fi
          echo "Baseline val_bpb (master): $BASELINE"

          IMPROVED=$(python3 -c "
          new = float('$NEW_VAL_BPB')
          baseline = float('$BASELINE')
          print('yes' if new < baseline else 'no')
          ")

          if [ "$IMPROVED" = "yes" ]; then
            echo "val_bpb improved ($NEW_VAL_BPB < $BASELINE) — merging into master."

            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git checkout -b _update_best_val_bpb_${{ github.run_id }} origin/master
            echo "$NEW_VAL_BPB" > best_val_bpb.txt
            git add best_val_bpb.txt
            git commit -m "ci: update best_val_bpb to $NEW_VAL_BPB [skip ci]"
            git push origin HEAD:master

            gh pr merge "${{ github.ref_name }}" --merge --auto --delete-branch || \
              gh pr merge "${{ github.ref_name }}" --merge --delete-branch
          else
            echo "val_bpb did not improve ($NEW_VAL_BPB >= $BASELINE) — skipping merge."
          fi
